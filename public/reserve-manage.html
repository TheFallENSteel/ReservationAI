<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manage reservation - Reservation System</title>
  <link rel="stylesheet" href="/public/css/styles.css" />
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/">Reservation System</a>
    <nav>
      <a href="/reserve">Book a table</a>
      <a href="/staff/login">Staff login</a>
    </nav>
  </header>
  <main>
    <div class="card">
      <h1>Manage my reservation</h1>
      <p class="muted">Enter the table ID and reservation ID you received when booking.</p>
      <div class="field-row">
        <div>
          <label for="resourceId">Table ID</label>
          <input type="text" id="resourceId" placeholder="table-1" />
        </div>
        <div>
          <label for="reservationId">Reservation ID</label>
          <input type="text" id="reservationId" placeholder="res-..." />
        </div>
      </div>
      <div class="actions">
        <button id="load-btn">Look up reservation</button>
      </div>
      <p id="message" class="message" hidden></p>
    </div>

    <div class="card" id="details" hidden>
      <h2>Reservation details</h2>
      <div class="field-row">
        <div>
          <label for="edit-date">Date</label>
          <input type="date" id="edit-date" />
        </div>
        <div>
          <label for="edit-start">Start time</label>
          <input type="time" id="edit-start" />
        </div>
        <div>
          <label for="edit-end">End time</label>
          <input type="time" id="edit-end" />
        </div>
        <div>
          <label for="edit-guests">Guests</label>
          <input type="number" id="edit-guests" min="1" />
        </div>
      </div>
      <p><strong>Status:</strong> <span id="status-badge" class="badge"></span></p>
      <div class="actions">
        <button id="save-btn">Save changes</button>
        <button id="cancel-btn" class="danger">Cancel reservation</button>
      </div>
    </div>
  </main>
  <script src="/public/js/api.js"></script>
  <script src="/public/js/reserve-manage.js"></script>
</body>
</html>
